version: 2

# Keeps dependencies patched across every ecosystem the wallet ships. Grouped so a
# routine bump is one PR per ecosystem, not dozens. Security updates are always raised
# individually and immediately, regardless of the weekly schedule below.
updates:
  # Web wallet (Vite / React) at the repo root.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      web-minor-and-patch:
        update-types: [minor, patch]

  # NestJS backend.
  - package-ecosystem: npm
    directory: "/backend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      backend-minor-and-patch:
        update-types: [minor, patch]

  # Desktop wallet (.NET 8 / Avalonia) — the fund-critical codebase.
  - package-ecosystem: nuget
    directory: "/desktop"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      desktop-minor-and-patch:
        update-types: [minor, patch]

  # The GitHub Actions themselves (pin drift, security fixes in the actions).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
